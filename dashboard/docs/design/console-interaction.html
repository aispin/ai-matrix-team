<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指挥台 · 交互稿（灰阶）· WO-20261006-03</title>
<!--
  交互稿（阶段 3，低保真）· 小蓉 / WO-20261006-03-dashboard-visual-refresh
  · 单文件零依赖，双击即开；只用灰阶，不验证美观，只验证结构与流程
  · 可走通：侧栏切换三页 / 台账原文抽屉 / 删除确认弹层 / 图-文切换 / 全屏 / 八态走查
  · 灰阶令牌 --g* 仅本稿使用；Phase B 一律映射到 src/styles.css 的 :root 语义令牌（见 README 映射表）
-->
<style>
:root{
  color-scheme:light;
  /* 灰阶（交互稿专用，无品牌色） */
  --g0:#ffffff;--g50:#f7f7f8;--g100:#eeeef1;--g200:#e1e1e5;--g300:#c9c9cf;--g400:#9d9da5;
  --g500:#737379;--g600:#54545b;--g700:#3d3d43;--g800:#27272c;--g900:#18181b;
  --canvas:var(--g50);--card:var(--g0);--line:var(--g200);--line-2:var(--g300);
  --ink:var(--g900);--ink-2:var(--g500);--ink-3:var(--g400);
  /* 层级：--field 用于卡内小底 */
  --field:var(--g100);
  --r-s:8px;--r-m:12px;--r-l:16px;
  /* §7：静态卡片只留 1px 边框，阴影只给浮层（抽屉/弹层）→ 单层阴影档位不再保留（§2.4 双层起） */
  --sh-lg:0 2px 6px rgba(24,24,27,.04),0 12px 32px rgba(24,24,27,.12);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--ink-2)}

/* ---------- 骨架 ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:248px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
/* 品牌区（WO-20261006-03 整改：移除竖条 .brand-bar；改用字号/字重/字距做中性锚点） */
.brand{display:flex;align-items:center;gap:10px;padding:17px 14px 15px}
.brand b{font-size:15px;font-weight:700;display:block;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-s);
  font-size:13px;color:var(--ink-2);border-left:3px solid transparent}
.nav-item svg{flex-shrink:0;opacity:.75}
.nav-item:hover{background:var(--field);color:var(--ink)}
.nav-item[data-on="true"]{background:var(--field);color:var(--ink);font-weight:600;border-left-color:var(--g800)}
.nav-item[data-on="true"] svg{opacity:1}
.nav-item .hint{margin-left:auto;font-size:11px;font-weight:400;color:var(--ink-3)}
.submenu{margin-top:8px;border-top:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;
  flex:1;min-height:0;max-height:320px;overflow-y:auto}
.submenu .cap{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);padding:2px 8px 6px}
.sub-item{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:var(--r-s);
  border-left:3px solid transparent;width:100%}
.sub-item:hover{background:var(--field)}
.sub-item[data-on="true"]{background:var(--field);border-left-color:var(--g800)}
.sub-item b{font-size:13px;font-weight:500}
.sub-item span{font-size:11px;color:var(--ink-2)}
.side-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-2);line-height:1.6}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.page-head{padding:20px 24px 12px;flex-shrink:0}
.page-head h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.page-head p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.head-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.head-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.views{flex:1;min-height:0;overflow-y:auto;padding:8px 24px 32px}
.views.pipeline{display:flex;flex-direction:column;min-height:0}

/* ---------- 通用控件 ---------- */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden;max-width:100%}
.seg button{padding:5px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[data-on="true"]{background:var(--g800);color:var(--g0);font-weight:600}
.seg button:hover:not([data-on="true"]){background:var(--field);color:var(--ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-s);color:var(--ink-2);border:1px solid var(--line-2);background:var(--card)}
.icon-btn:hover{background:var(--field);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r-s);
  font-size:13px;font-weight:500;border:1px solid var(--line-2);background:var(--card);color:var(--ink)}
.btn:hover{background:var(--field)}
.btn-pri{background:var(--g800);color:var(--g0);border-color:var(--g800)}
.btn-pri:hover{background:var(--g700)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}

/* ---------- 摘要条 ---------- */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;
  background:var(--field);border:1px solid var(--line-2);color:var(--ink-2)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--g600)}
.chip.solid{background:var(--g800);color:var(--g0);border-color:var(--g800)}
.chip.blk{border-color:var(--g800);border-width:1px;border-style:solid;color:var(--ink);font-weight:600}
.chip.blk .dot{background:transparent;border:2px solid var(--g800)}

/* ---------- 泳道 ---------- */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start;flex:1;min-height:0}
.lane{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;
  display:flex;flex-direction:column;min-height:0;min-width:0}
.lane-h{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;margin:0 0 12px;flex-shrink:0;min-width:0}
.lane-h::after{content:"";flex:1;height:1px;background:var(--line)}
.lane-h .n{color:var(--ink-2);font-weight:500;flex-shrink:0}
.lane-body{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}
.row-item{background:var(--field);border-radius:var(--r-s);padding:9px 10px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.row-item.clickable{cursor:pointer;border-left:3px solid transparent}
.row-item.clickable:hover{border-left-color:var(--g800)}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--g0);background:var(--g600)}
.avatar.sm{width:24px;height:24px;font-size:11px}
.row-main{min-width:0;flex:1;overflow-wrap:anywhere}
.row-main b{font-size:12.5px;font-weight:600}
.row-main .meta{font-size:11px;color:var(--ink-2);margin-top:2px;line-height:1.55;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:1px 7px;border-radius:999px;
  background:var(--card);border:1px solid var(--line-2);color:var(--ink-2)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.status-dot.on{background:var(--g800)}
.status-dot.off{background:transparent;border:1.5px solid var(--g300)}
.lane-empty{padding:8px 2px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.closed-item{position:relative}
.del-btn{width:28px;height:28px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-s);color:var(--ink-3);border:1px solid transparent}
.closed-item:hover .del-btn{color:var(--ink);border-color:var(--line-2)}
.del-btn:hover{background:var(--card);color:var(--g900)}
.mini-cap{font-size:11px;font-weight:600;color:var(--ink-2);margin:10px 0 6px}
.closed-mini{display:flex;flex-direction:column;gap:4px}
.closed-mini button{display:flex;gap:6px;font-size:11px;color:var(--ink-2);padding:5px 8px;border-radius:var(--r-s);width:100%;align-items:center}
.closed-mini button:hover{background:var(--field);color:var(--ink)}

/* ---------- 汇报 ---------- */
.report-wrap{max-width:1020px}
.report-art{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:20px}
.report-art .cap{font-size:11px;color:var(--ink-2);margin-bottom:12px;display:flex;justify-content:space-between;gap:12px}
.md h1{font-size:20px;margin:0 0 8px}
.md h2{font-size:15px;margin:18px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.md blockquote{margin:6px 0 14px;padding-left:12px;border-left:3px solid var(--line-2);color:var(--ink-2);font-size:13px}
.md ul{margin:6px 0;padding-left:20px}
.md li{margin:3px 0;line-height:1.65}
.md code{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.85em}

/* ---------- 关于 ---------- */
.about{display:flex;flex-direction:column;gap:20px;max-width:1080px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:20px}
.card h2{margin:0;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mini-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px}
.mini-card b{font-size:13.5px}
.mini-card p{margin:6px 0 0;font-size:12px;color:var(--ink-2);line-height:1.6}
.poem{background:var(--field);border-radius:var(--r-s);border-left:3px solid var(--g700);padding:14px 16px;margin-top:14px}
.poem p{margin:3px 0;font-size:13px;color:var(--ink-2);line-height:1.9}
.ask{width:100%;border:1px dashed var(--line-2);background:var(--field);border-radius:var(--r-s);padding:10px 12px;font-size:13px;margin-top:8px}
.ask:hover{background:var(--card)}

/* ---------- 抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(24,24,27,.45);z-index:50;display:none}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);background:var(--card);
  border-left:1px solid var(--line);box-shadow:var(--sh-lg);z-index:56;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.drawer.on{transform:translateX(0)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.drawer-h b{font-size:14px}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 28px}
.modal-mask{position:fixed;inset:0;background:rgba(24,24,27,.45);z-index:60;display:none;align-items:center;justify-content:center}
.modal-mask.on{display:flex}
.modal{width:min(400px,calc(100vw - 48px));background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-l);padding:20px;box-shadow:var(--sh-lg)}
.modal h3{margin:0;font-size:16px}
.modal p{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin:10px 0 0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ---------- 状态走查 ---------- */
.statewrap{background:var(--card);border:1px dashed var(--line-2);border-radius:var(--r-m);padding:18px}
.statewrap>.note{font-size:12px;color:var(--ink-2);margin:0 0 14px}
.center-state{text-align:center;max-width:360px;margin:32px auto;display:flex;flex-direction:column;align-items:center}
.center-state .ic{width:52px;height:52px;border-radius:14px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--ink-2);margin-bottom:14px}
.center-state h4{margin:0 0 6px;font-size:14px}
.center-state p{margin:0 0 16px;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.err-meta{font-size:11px;color:var(--ink-2);background:var(--field);border-radius:6px;padding:6px 10px;margin-top:14px}
.skel{display:flex;flex-direction:column;gap:12px}
.skel-row{display:flex;gap:12px;align-items:center}
.sk{background:linear-gradient(90deg,var(--g100) 25%,var(--g200) 37%,var(--g100) 63%);background-size:200% 100%;
  border-radius:6px;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk.av{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.sk.l{height:10px}.sk.m{height:12px}.sk.xl{height:16px}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-s);
  background:var(--field);border:1px solid var(--line-2);font-size:12.5px;margin-bottom:16px}
.banner .t{flex:1}.banner .t small{display:block;color:var(--ink-2);font-size:11.5px;margin-top:2px}
.partial-bar{height:6px;border-radius:3px;background:var(--field);overflow:hidden;display:flex;margin-bottom:12px}
.partial-bar i{display:block;height:100%;background:var(--g700)}
.partial-bar i.err{background:repeating-linear-gradient(45deg,var(--g400),var(--g400) 3px,var(--g200) 3px,var(--g200) 6px)}

/* ---------- 走查标注 ---------- */
.hot{position:absolute;z-index:40;width:20px;height:20px;border-radius:50%;background:var(--g900);color:var(--g0);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px rgba(255,255,255,.9);pointer-events:none}
.rel{position:relative}
.legend{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;margin-bottom:16px}
.legend h3{margin:0 0 8px;font-size:13px}
.legend ol{margin:0;padding-left:20px;font-size:12.5px;color:var(--ink-2);line-height:1.9}
.legend code{background:var(--field);border-radius:4px;padding:0 4px}

@media(max-width:1000px){ .lanes{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:640px){
  .app{flex-direction:column}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav-item{border-left:0;border-bottom:3px solid transparent}
  .nav-item[data-on="true"]{border-left-color:transparent;border-bottom-color:var(--g800)}
  .nav-item .hint{display:none}
  .submenu-area-mobile{display:none}
  .side-foot{display:none}
  .lanes{grid-template-columns:1fr}
  .grid3,.grid2{grid-template-columns:1fr}
  .views{padding:8px 14px 32px}
  .page-head{padding:14px 14px 10px}
  /* 走查状态条：窄屏折为可换行 chip 组，8 态标签均可达 / 可读 / 无裁切（P1-1） */
  .head-tools{min-width:0}
  #state-seg{display:flex;flex-wrap:wrap;gap:6px;border:0;border-radius:0;overflow:visible;max-width:100%}
  #state-seg button{border:1px solid var(--line-2);border-radius:999px;padding:4px 10px}
  #state-seg button+button{border-left:1px solid var(--line-2)}
  #state-seg button[data-on="true"]{border-color:var(--g800)}
  .drawer{width:100vw}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div><b>AI Matrix Team</b><span>指挥台 · 本地面板</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="submenu" id="submenu"></div>
    <p class="side-foot">数据来源：.skills/runtime 台账（唯一真相源）· 汇报库 dashboard.db</p>
  </aside>

  <main class="main">
    <header class="page-head">
      <div class="head-row">
        <div>
          <h1 id="page-title">交付管线</h1>
          <p id="page-sub">谁在干什么 · 哪里卡住 · 什么办结了</p>
        </div>
        <div class="head-tools">
          <span class="sub" style="font-size:11px">走查状态</span>
          <div class="seg" id="state-seg" role="group" aria-label="状态走查"></div>
        </div>
      </div>
    </header>
    <div class="views" id="views"></div>
  </main>
</div>

<div class="mask" id="drawer-mask"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="台账原文" aria-modal="true">
  <header class="drawer-h">
    <b id="drawer-id">—</b>
    <span class="pill" id="drawer-kind">工单</span>
    <button class="btn btn-sm" style="margin-left:auto" id="drawer-close" aria-label="关闭抽屉">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="drawer-body md" id="drawer-body"></div>
</aside>

<div class="modal-mask" id="modal-mask">
  <div class="modal" role="dialog" aria-modal="true" aria-label="删除归档单">
    <h3>删除归档单</h3>
    <p>确定删除 <b class="mono" id="del-id">—</b> 吗？该归档单文件及其台账行会被移除（git 历史里仍可找回）。</p>
    <div class="modal-foot">
      <button class="btn" id="del-cancel">取消</button>
      <button class="btn btn-pri" id="del-ok">删除</button>
    </div>
  </div>
</div>

<script>
/* ============================ 真实数据（取自 .skills/runtime 台账 / about.json / dashboard.db） ============================ */
var DATA = {

  ],
  activeWo:[

  ],
  closedWo:[
    {id:'WO-20261006-01-dashboard-disambiguation',purpose:'创始人实测反馈：说「打开指挥台」，起了 isk…'},

    '<h2>需要您定的事</h2><p>没有。您该忙忙，有需要拍板的我会带着选项来找您。</p>'+
  '</div>';
}

/* ============================ 关于页 ============================ */
function renderAbout(){
  if(S.state==='loading') return '<div class="about"><div class="card">'+skeleton([' w40',' w100',' w80'])+'</div></div>';
  if(S.state==='empty') return emptyState({icon:'inbox',title:'团队档案缺失',body:'没读到 about.json 或 config.json。',action:'让 Hugo 检查档案'});
  if(S.state==='error') return errorState({title:'团队档案加载失败',body:'请求 /api/profile 失败。',code:'HTTP 500 · /api/profile · 请求 ID: req_2c88'});
  if(S.state==='noperm') return nopermState({title:'没有访问权限',body:'（演示态）本地面板无鉴权；多用户后此处给权限说明 + 申请入口。'});
  var t=DATA.team;
  var poem=(S.state==='partial')?'':'<div class="poem"><p style="font-weight:600;color:var(--ink)">花名志 · 致老友们</p>'+t.poem.map(function(l){return '<p>'+esc(l)+'</p>';}).join('')+'</div>';
  var caps=t.caps.map(function(c){return '<div class="mini-card"><b>'+esc(c.t)+'</b><p>'+esc(c.d)+'</p></div>';}).join('');
  var members=t.about_members.map(function(m){return '<div class="mini-card" style="display:flex;gap:10px;align-items:flex-start"><span class="avatar sm">'+esc(m.name[0])+'</span><div><b>'+esc(m.name)+'</b><p style="margin-top:2px">'+esc(m.role)+'</p></div></div>';}).join('');
  var tryAsk=t.tryAsk.map(function(q){return '<button class="ask">'+ (S.state==='long'?esc(q)+'（这是一条刻意加长的示例，验证长句在按钮内的换行表现，不出现横向滚动）':'「'+esc(q)+'」') +'</button>';}).join('');
  var banner=(S.state==='offline')?offlineBanner():'';
  var partialNote=(S.state==='partial')?'<div class="banner">'+I('alert',16)+'<div class="t">「花名志」段落加载失败<small>团队档案其余部分正常显示；仅该区块降级隐藏</small></div><button class="btn btn-sm">重试该区块</button></div>':'';
  return banner+partialNote+'<div class="about">'+
    '<section class="card"><h2>'+esc(t.name)+'</h2><p class="sub" style="margin:6px 0 0">'+esc(t.tagline)+'</p><p style="margin:12px 0 0;line-height:1.75">'+esc(t.about)+'</p></section>'+
    poem+
    '<section><h2 style="font-size:15px;margin:0 0 12px">我们擅长什么</h2><div class="grid3">'+caps+'</div></section>'+
    '<section><h2 style="font-size:15px;margin:0 0 12px">团队成员</h2><div class="grid3">'+members+'</div></section>'+
    '<section class="card"><h2>试试这样问我</h2><p class="sub" style="margin:6px 0 10px;font-size:12px">在专家团对话里直接说下面任意一句（点一下即复制）：</p>'+tryAsk+'</section>'+
  '</div>';
}

/* ============================ 抽屉 / 弹层 ============================ */
var WO_DOC='# WO-20261006-03-dashboard-visual-refresh · 任务单\n\n> 模板唯一真相源：`.skills/docs/templates/wo.md`。\n\n| 字段 | 值 |\n|---|---|\n| **id** | WO-20261006-03-dashboard-visual-refresh |\n| 状态 | LOCKED |\n| 申请人 | Hugo（产研高级总监） |\n| 执行角色 | designer#1（小蓉） |\n| 验收级别 | L2 亲验收 |\n\n## 1. 目的与背景\n\n创始人反馈：「让设计师优化下我们的控制台，现在很丑。」\n\n本单先由小蓉出交互稿 + 视觉稿（新增文件，零代码改动），创始人确认后另起实现 Phase。\n\n## 2. 面域与路径白名单\n\n| 面域 | 路径（glob） |\n|---|---|\n| C2 | `.skills/dashboard/docs/design/**`（本轮唯一核准写入范围） |\n\n> 禁止改动：`server/**` · `data/**` · `package.json` · 任何台账脚本。';
var DR_DOC='# DR-20261005-002 · 存量未提交受控改动（lucia/boduo 在途工作）按单归属还是分开提交\n\n| 字段 | 值 |\n|---|---|\n| 类型 | Type 2（可逆） |\n| 阻塞 | BLOCKING |\n| 状态 | ANSWERED |\n| 提出日 | 2026-10-05 |\n| 期限 | 2026-10-12 |\n\n## 背景\n\n存量未提交的受控改动涉及两个 App 的在途工作。需要创始人裁定：按单归属提交，还是分开提交。\n\n## 结论\n\n已答复，闭环。';
function openDrawer(kind,id){
  document.getElementById('drawer-id').textContent=id;
  document.getElementById('drawer-kind').textContent=(kind==='wo'?DATA.terms.wo:DATA.terms.dr);
  var md=kind==='wo'?WO_DOC:DR_DOC;
  // 极简 markdown 渲染（标题 / 引用 / 表格统一按纯文本块呈现）
  document.getElementById('drawer-body').innerHTML='<pre class="mono" style="white-space:pre-wrap;font-size:12.5px;line-height:1.7;margin:0">'+esc(md)+'</pre>';
  document.getElementById('drawer').classList.add('on');
  document.getElementById('drawer-mask').classList.add('on');
  document.getElementById('drawer-close').focus();
}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('drawer-mask').classList.remove('on');}
var pendingDel=null;
function openModal(id){pendingDel=id;document.getElementById('del-id').textContent=id;document.getElementById('modal-mask').classList.add('on');document.getElementById('del-ok').focus();}
function closeModal(){document.getElementById('modal-mask').classList.remove('on');pendingDel=null;}

/* ============================ 渲染 + 事件 ============================ */
function render(){
  renderNav();renderSubmenu();renderHead();
  var v=document.getElementById('views');
  v.className='views'+(S.page==='pipeline'?' pipeline':'');
  if(S.page==='pipeline') v.innerHTML=renderPipeline();
  else if(S.page==='reports') v.innerHTML=renderReport();
  else v.innerHTML=renderAbout();
  bind();
}
function renderReport(){
  // 汇报页：把 toggle 放到 head-tools 里（与主题切换同一行，规避右上角三向重叠）
  var sel=DATA.reports.filter(function(r){return r.id===S.report;})[0]||DATA.reports[0];
  var hasSvg=sel.svg;
  var toggle='<div class="seg" role="group" aria-label="展示模式切换">'+
    '<button data-mode="svg" data-on="'+(S.mode==='svg'&&hasSvg)+'" '+(hasSvg?'':'disabled')+' title="图形版">'+I('image',16)+'</button>'+
    '<button data-mode="md" data-on="'+(S.mode==='md'||!hasSvg)+'" title="文字版">'+I('doc',16)+'</button>'+
    (hasSvg?'<button data-full title="全屏查看">'+I('expand',16)+'</button>':'')+'</div>';
  document.getElementById('page-sub').innerHTML='大白话图形版 · 历史可回看 <span style="margin-left:10px;display:inline-flex;vertical-align:middle">'+toggle+'</span>';
  if(S.state==='loading') return '<div class="report-wrap"><div class="report-art">'+skeleton([' w80',' w60',' w100',' w40'])+'</div></div>';
  if(S.state==='empty') return emptyState({icon:'doc',title:'还没有汇报',body:'对 Hugo 说「汇报工作进展」，就会生成第一份图形版汇报。',action:'让 Hugo 汇报工作进展'});
  if(S.state==='error') return errorState({title:'这份汇报加载失败',body:'请求 /api/reports/'+S.report+' 失败。',code:'HTTP 500 · /api/reports/'+S.report+' · 请求 ID: req_7b21'});
  if(S.state==='noperm') return nopermState({title:'没有查阅权限',body:'（演示态）本地面板无鉴权；多用户后此处改为权限说明 + 申请入口。'});
  if(S.state==='partial'||!hasSvg) return '<div class="banner">'+I('alert',16)+'<div class="t">这份汇报没有图形版（v1 老汇报）<small>已自动切到文字版；「图形版 / 全屏」按钮置灰</small></div><button class="btn btn-sm">重试</button></div><div class="report-wrap">'+mdBody()+'</div>';
  var inner=(S.mode==='md')?mdBody():svgArt();
  if(S.state==='long') inner='<div class="report-wrap"><div class="report-art md"><p>该汇报正文刻意加长，用于验证超长 Markdown 的滚动：中英混排 markdowninlinecode 与无空格长串 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa 都应换行或截断，页面整体不出现横向滚动条。</p>'+mdBody()+'</div></div>';
  if(S.state==='offline') return offlineBanner()+'<div class="report-wrap">'+(S.mode==='md'?mdBody():svgArt())+'</div>';
  return '<div class="report-wrap">'+inner+'</div>';
}
function bind(){
  var v=document.getElementById('views');
  v.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){S.mode=b.getAttribute('data-mode');render();};});
  v.querySelectorAll('[data-full]').forEach(function(b){b.onclick=function(){closeDrawer();openDrawer('wo',DATA.reports.filter(function(r){return r.id===S.report;})[0].title);};});
  v.querySelectorAll('[data-open-wo]').forEach(function(b){b.onclick=function(){openDrawer('wo',b.getAttribute('data-open-wo'));};});
  v.querySelectorAll('[data-open-dr]').forEach(function(b){b.onclick=function(){openDrawer('dr',b.getAttribute('data-open-dr'));};});
  v.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(e){e.stopPropagation();openModal(b.getAttribute('data-del'));};});
  // reports 页 head 里的 toggle
  document.querySelectorAll('#page-sub [data-mode]').forEach(function(b){b.onclick=function(){S.mode=b.getAttribute('data-mode');render();};});
  document.querySelectorAll('#page-sub [data-full]').forEach(function(b){b.onclick=function(){openModal('全屏灯箱（演示：交互稿不实现缩放）');};});
}
document.getElementById('drawer-mask').onclick=closeDrawer;
document.getElementById('drawer-close').onclick=closeDrawer;
document.getElementById('del-cancel').onclick=closeModal;
document.getElementById('del-ok').onclick=function(){closeModal();};
document.getElementById('modal-mask').onclick=function(e){if(e.target.id==='modal-mask')closeModal();};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDrawer();closeModal();}});

render();
</script>
</body>
</html>
