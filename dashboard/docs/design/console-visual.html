<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)">
<title>指挥台 · 视觉稿（浅深双主题）· WO-20261006-03</title>
<!--
  视觉稿（阶段 4，高保真）· 小蓉 / WO-20261006-03-dashboard-visual-refresh
  · 单文件零依赖，双击即开；浅色 + 深色一次给全（跟随系统 + 手动切换 + 记忆偏好）
  · 色彩定案：创始人 2026-10-06 定 候选 B「冷静灰」（中性冷灰底座 + 暖橙作品牌点）；暖夜灯降级为评审对比
  · 令牌命名 1:1 对齐 src/styles.css 的 :root（--surface/-2 · --border · --text/-2 · --accent/-deep/-soft · --danger · --ok）
    新增令牌：--warn · --warn-soft · --ok-soft · --danger-soft · --focus-ring（Phase B 并入 :root，见 README 映射表）
  · 图标全部自绘 SVG（24×24 · stroke 1.5 · currentColor · 零 emoji）
  · 顶部细条为「设计评审工具」，不属于产品 UI：用于色彩方向对比 + 状态陈列
-->
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;var p=localStorage.getItem('palette');if(p)document.documentElement.dataset.palette=p;}catch(e){}</script>
<style>
/* ============ 设计令牌（主稿 = 创始人已定案 候选 B「冷静灰」；令牌命名对齐 dashboard src/styles.css :root，Phase B 1:1 映射） ============ */
:root{
  color-scheme:light;
  /* —— 中性冷灰底座（定案 B；暖夜灯降级为评审对比，见下方 [data-palette="warm"]） —— */
  --bg-top:#F3F5F9; --bg-bottom:#E4E8F0;
  --surface:#ffffff; --surface-2:#F2F4F8; --border:#DEE3EC;
  --text:#1A1D24; --text-2:#5B6270;
  /* —— 品牌点：保留暖橙，面积收敛到品牌点/选中态/主按钮/焦点环 —— */
  --accent:#EA580C; --accent-deep:#C2410C; --accent-soft:#FFF1E6;
  --danger:#DC2626; --ok:#047857;
  /* —— 本轮新增 —— */
  --warn:#B45309; --warn-soft:#FEF3C7;
  --ok-soft:#ECFDF5; --danger-soft:#FEF2F2;
  --focus-ring:rgba(234,88,12,.30);
  /* 成员身份色（头像底 · 与主题无关的固定标识；集中令牌化，不再散落硬编码） */
  --id-1:#f59e0b; --id-2:#8b5cf6; --id-3:#ec4899; --id-4:#3b82f6;
  --id-5:#10b981; --id-6:#06b6d4; --id-7:#ef4444; --id-8:#f97316;
  /* 圆角 / 阴影 / 骨架（Phase B 进 @theme 静态令牌）
     §7：静态卡片只留 1px 边框，阴影只给 hover 抬起与浮层；故阴影档位从两条起（双层叠加，§2.4） */
  --r-1:8px; --r-2:12px; --r-3:16px;
  --sh-2:0 1px 2px rgba(28,25,23,.04),0 2px 8px rgba(28,25,23,.06);
  --sh-3:0 2px 6px rgba(28,25,23,.04),0 12px 32px rgba(28,25,23,.10);
  --skel:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);
  --head-bg:rgba(255,255,255,.72);
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg-top:#0F1218; --bg-bottom:#161A21;
  --surface:#1B202A; --surface-2:#232935; --border:#333B48;
  --text:#EDEFF3; --text-2:#9AA3B2;
  /* 深色品牌色单独指定（design-system §2.6 规则 9：橙属红橙黄棕系，禁用公式推导） */
  --accent:#FB923C; --accent-deep:#FDBA74; --accent-soft:#3A2413;
  --danger:#F87171; --ok:#34D399;
  --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14);
  --ok-soft:rgba(52,211,153,.14); --danger-soft:rgba(248,113,113,.14);
  --focus-ring:rgba(251,146,60,.45);
  --sh-2:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.35);
  --sh-3:0 2px 6px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.5);
  --skel:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);
  --head-bg:rgba(27,32,42,.72);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg-top:#0F1218; --bg-bottom:#161A21;
    --surface:#1B202A; --surface-2:#232935; --border:#333B48;
    --text:#EDEFF3; --text-2:#9AA3B2;
    --accent:#FB923C; --accent-deep:#FDBA74; --accent-soft:#3A2413;
    --danger:#F87171; --ok:#34D399;
    --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14);
    --ok-soft:rgba(52,211,153,.14); --danger-soft:rgba(248,113,113,.14);
    --focus-ring:rgba(251,146,60,.45);
    --sh-2:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.35);
    --sh-3:0 2px 6px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.5);
    --skel:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);
    --head-bg:rgba(27,32,42,.72);
  }
}

/* ============ 评审对比候选 A「暖夜灯」（原主稿，创始人 2026-10-06 定案 B 后降级；仅对比用） ============ */
:root[data-palette="warm"]{
  --bg-top:#FDF8F3; --bg-bottom:#F3E3D2;
  --surface:#ffffff; --surface-2:#FAF3EA; --border:#F0DCC6;
  --text:#1C1917; --text-2:#78716C;
  --accent:#EA580C; --accent-deep:#C2410C; --accent-soft:#FFEDD5;
  --danger:#DC2626; --ok:#059669;
  --warn:#B45309; --warn-soft:#FEF3C7;
  --ok-soft:#ECFDF5; --danger-soft:#FEF2F2;
  --focus-ring:rgba(234,88,12,.35);
}
:root[data-palette="warm"][data-theme="dark"]{
  --bg-top:#1B1815; --bg-bottom:#26211C;
  --surface:#292524; --surface-2:#211E1B; --border:#44403C;
  --text:#FAFAF9; --text-2:#A8A29E;
  --accent:#F59E0B; --accent-deep:#FBBF24; --accent-soft:#78350F;
  --danger:#F87171; --ok:#34D399;
  --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14);
  --ok-soft:rgba(52,211,153,.14); --danger-soft:rgba(248,113,113,.14);
  --focus-ring:rgba(245,158,11,.45);
  --head-bg:rgba(41,37,36,.72);
}
@media (prefers-color-scheme:dark){
  :root[data-palette="warm"]:not([data-theme="light"]){
    --bg-top:#1B1815; --bg-bottom:#26211C;
    --surface:#292524; --surface-2:#211E1B; --border:#44403C;
    --text:#FAFAF9; --text-2:#A8A29E;
    --accent:#F59E0B; --accent-deep:#FBBF24; --accent-soft:#78350F;
    --danger:#F87171; --ok:#34D399;
    --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14);
    --ok-soft:rgba(52,211,153,.14); --danger-soft:rgba(248,113,113,.14);
    --focus-ring:rgba(245,158,11,.45);
    --head-bg:rgba(41,37,36,.72);
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom)) fixed;color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  transition:background-color .18s,color .18s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--text-2)}

/* ============ 评审条（设计工具，非产品 UI） ============ */
.reviewbar{min-height:38px;display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:12px;flex-wrap:wrap;row-gap:6px;
  background:var(--surface);border-bottom:1px dashed var(--border);color:var(--text-2);position:relative;z-index:80}
.reviewbar .tag{font-weight:600;color:var(--text);border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-size:11px}
.reviewbar .grow{flex:1}
.reviewbar button{padding:3px 10px;font-size:11.5px}

/* ============ 应用骨架 ============ */
.wrap{height:calc(100vh - 38px);display:flex;overflow:hidden}
.app{display:flex;flex:1;min-width:0;height:100%}
.side{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:background-color .18s,border-color .18s}
/* 品牌区（WO-20261006-03 整改：移除橙色竖条 .brand-bar；改用字号/字重/字距做中性锚点） */
.brand{display:flex;align-items:center;gap:10px;padding:17px 14px 15px}
.brand b{font-size:15px;font-weight:700;display:block;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--text-2);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-1);
  font-size:13px;color:var(--text-2);border-left:3px solid transparent;transition:background .12s,color .12s}
.nav-item svg{flex-shrink:0;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item[data-on="true"]{background:var(--accent-soft);color:var(--accent-deep);font-weight:600;border-left-color:var(--accent)}
.nav-item[data-on="true"] svg{opacity:1}
.nav-item .hint{margin-left:auto;font-size:11px;font-weight:400;color:var(--text-2)}
.submenu{margin-top:8px;border-top:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:2px;
  flex:1;min-height:0;max-height:340px;overflow-y:auto}
.submenu .cap{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text-2);padding:2px 8px 6px}
.sub-item{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:var(--r-1);border-left:3px solid transparent;width:100%;transition:background .12s}
.sub-item:hover{background:var(--surface-2)}
.sub-item[data-on="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.sub-item b{font-size:13px;font-weight:500}
.sub-item span{font-size:11px;color:var(--text-2)}
.side-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text-2);line-height:1.6}
.side-foot .theme-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.side-foot .theme-row span{flex:1}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.page-head{position:sticky;top:0;z-index:20;background:var(--head-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:16px 24px 12px;flex-shrink:0;transition:background-color .18s,border-color .18s}
.head-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.page-head p{margin:2px 0 0;font-size:13px;color:var(--text-2)}
.head-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.views{flex:1;min-height:0;overflow-y:auto;padding:18px 24px 36px}
.views.pipeline{display:flex;flex-direction:column;min-height:0;padding-top:18px}

/* ============ 控件 ============ */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-1);overflow:hidden;background:var(--surface)}
.seg button{padding:5px 10px;font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--border)}
.seg button[data-on="true"]{background:var(--accent);color:#1C1917;font-weight:600}
/* 主色底统一配深字（两主题同口径）：浅 #1C1917 on #EA580C ≈ 4.91:1 · 深 #1C1917 on #FB923C ≈ 7.73:1（均 ≥4.5:1）；白字在浅色主色上仅 3.56:1，不达标，故弃用 */
[data-theme="dark"] .seg button[data-on="true"]{color:#1C1917}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .seg button[data-on="true"]{color:#1C1917} }
.seg button:hover:not([data-on="true"]){background:var(--surface-2);color:var(--text)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-1);color:var(--text-2);border:1px solid var(--border);background:var(--surface);transition:all .12s}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--accent)}
.icon-btn .sun{display:none}
[data-theme="dark"] .icon-btn .moon{display:none}
[data-theme="dark"] .icon-btn .sun{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .icon-btn .moon{display:none}
  :root:not([data-theme="light"]) .icon-btn .sun{display:block}
}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r-1);
  font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .12s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--accent);color:#1C1917;border-color:var(--accent)}
[data-theme="dark"] .btn-pri{color:#1C1917}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn-pri{color:#1C1917} }
/* hover 保持主色底 + 深字（不切 accent-deep：深字 on #C2410C 仅 3.38:1），用 brightness 提亮做反馈；浅 ≈5.68:1 · 深 ≈8.51:1 */
.btn-pri:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.08)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
input,select{font:inherit}

/* ============ 摘要条 ============ */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--text-2)}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.ok .dot{background:var(--ok)}
.chip.dr{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
[data-theme="dark"] .chip.dr{color:#1C1917}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chip.dr{color:#1C1917} }
.chip.dr .dot{background:currentColor}
.chip.warnc{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

/* ============ 泳道 ============ */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start;flex:1;min-height:0}
.lane{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:16px;
  display:flex;flex-direction:column;min-height:0;min-width:0;transition:background-color .18s,border-color .18s,box-shadow .2s}
.lane:hover{box-shadow:var(--sh-2)}
.lane-h{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--text);margin:0 0 14px;flex-shrink:0;min-width:0}
.lane-h .n{color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums;flex-shrink:0}
.lane-h::after{content:"";flex:1;height:1px;background:var(--border)}
.lane-body{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}
.row-item{background:var(--surface-2);border-radius:var(--r-1);padding:10px;display:flex;gap:10px;align-items:flex-start;transition:background .12s,box-shadow .12s;min-width:0}
.row-item.clickable{cursor:pointer;border-left:3px solid transparent}
.row-item.clickable:hover{background:var(--surface);box-shadow:var(--sh-2);border-left-color:var(--accent)}
.row-item.alert{border-left:3px solid var(--danger)}
.row-item.warn{border-left:3px solid var(--warn)}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff}
.avatar.sm{width:26px;height:26px;font-size:11px}
.row-main{min-width:0;flex:1;overflow-wrap:anywhere}
.row-main b{font-size:12.5px;font-weight:600}
.row-main .meta{font-size:11px;color:var(--text-2);margin-top:3px;line-height:1.55;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:1px 7px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.status-dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.status-dot.off{background:transparent;border:1.5px solid var(--border)}
.lane-empty{padding:6px 2px;font-size:12.5px;color:var(--text-2);line-height:1.65}
.closed-item{position:relative}
.del-btn{width:28px;height:28px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-1);color:var(--text-2);border:1px solid transparent;opacity:.5;transition:all .12s}
.closed-item:hover .del-btn{opacity:1}
.del-btn:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.mini-cap{font-size:11px;font-weight:600;color:var(--text-2);margin:12px 0 6px}
.closed-mini{display:flex;flex-direction:column;gap:4px}
.closed-mini button{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--text-2);padding:6px 8px;border-radius:var(--r-1);width:100%}
.closed-mini button:hover{background:var(--surface-2);color:var(--text)}
.closed-mini .ic-ok{color:var(--ok);flex-shrink:0}

/* ============ 汇报 ============ */
.report-wrap{max-width:1040px}
.report-art{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:20px}
.report-art .cap{font-size:11px;color:var(--text-2);margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.md h1{font-size:20px;margin:0 0 8px}
.md h2{font-size:15px;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);color:var(--accent-deep)}
.md blockquote{margin:6px 0 16px;padding-left:12px;border-left:3px solid var(--accent);color:var(--text-2);font-size:13px}
.md ul{margin:6px 0;padding-left:20px}
.md li{margin:3px 0;line-height:1.7}
.md code{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:.85em}

/* ============ 关于 ============ */
.about{display:flex;flex-direction:column;gap:20px;max-width:1100px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:20px}
.card h2{margin:0;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:14px;transition:box-shadow .2s,border-color .2s}
.mini-card:hover{box-shadow:var(--sh-2);border-color:var(--accent-soft)}
.mini-card b{font-size:13.5px}
.mini-card p{margin:6px 0 0;font-size:12px;color:var(--text-2);line-height:1.65}
.poem{background:var(--surface-2);border-radius:var(--r-1);border-left:3px solid var(--accent);padding:16px 18px;margin-top:16px}
.poem p{margin:3px 0;font-size:13px;color:var(--text-2);line-height:1.95}
.ask{width:100%;border:1px dashed var(--border);background:var(--surface-2);border-radius:var(--r-1);padding:10px 12px;font-size:13px;margin-top:8px;transition:all .12s}
.ask:hover{background:var(--surface);border-color:var(--accent);color:var(--text)}
.ask-copied{color:var(--ok);font-size:12px;margin-left:8px}

/* ============ 抽屉 / 弹层 ============ */
.mask{position:fixed;inset:0;background:rgba(28,25,23,.45);backdrop-filter:blur(2px);z-index:50;display:none}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);background:var(--surface);
  border-left:1px solid var(--border);box-shadow:var(--sh-3);z-index:56;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.7,.3,1)}
.drawer.on{transform:translateX(0)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-h b{font-size:14px}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 28px}
.modal-mask{position:fixed;inset:0;background:rgba(28,25,23,.5);backdrop-filter:blur(2px);z-index:60;display:none;align-items:center;justify-content:center}
.modal-mask.on{display:flex}
.modal{width:min(400px,calc(100vw - 48px));background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-3);padding:20px;box-shadow:var(--sh-3)}
.modal h3{margin:0;font-size:16px}
.modal p{font-size:13.5px;color:var(--text-2);line-height:1.7;margin:10px 0 0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
[data-theme="dark"] .btn-danger{color:#1C1917}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn-danger{color:#1C1917} }
.btn-danger:hover{opacity:.92}

/* ============ 状态构件 ============ */
.center-state{text-align:center;max-width:380px;margin:40px auto;display:flex;flex-direction:column;align-items:center}
.center-state .ic{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);margin-bottom:16px}
.center-state .ic.err{background:var(--danger-soft);color:var(--danger)}
.center-state .ic.warn{background:var(--warn-soft);color:var(--warn)}
.center-state .ic.ok{background:var(--ok-soft);color:var(--ok)}
.center-state h4{margin:0 0 6px;font-size:14.5px}
.center-state p{margin:0 0 16px;font-size:12.5px;color:var(--text-2);line-height:1.7}
.err-meta{font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-top:14px}
.skel{display:flex;flex-direction:column;gap:12px;width:100%}
.skel-row{display:flex;gap:12px;align-items:center}
.sk{background:var(--skel);background-size:200% 100%;border-radius:6px;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk.av{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.sk.l{height:10px}.sk.m{height:12px}.sk.xl{height:16px}
@media (prefers-reduced-motion:reduce){ .sk{animation:none} }
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-1);
  background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);font-size:12.5px;margin-bottom:16px}
.banner.err{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.banner .t{flex:1;color:var(--text)}
.banner .t small{display:block;color:var(--text-2);font-size:11.5px;margin-top:2px}
.banner .ic{flex-shrink:0}
.partial-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex;margin-bottom:12px}
.partial-bar i{display:block;height:100%;background:var(--ok)}
.partial-bar i.err{background:repeating-linear-gradient(45deg,var(--danger),var(--danger) 3px,transparent 3px,transparent 6px)}

/* ============ 状态陈列 ============ */
.gallery{position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));overflow-y:auto;padding:24px}
.gallery-head{max-width:1280px;margin:0 auto 20px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.gallery-head h1{font-size:22px;font-weight:700;margin:0}
.gallery-head p{margin:4px 0 0;font-size:13px;color:var(--text-2);max-width:70ch}
.gallery-grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}
.demo{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden;display:flex;flex-direction:column}
.demo-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;background:var(--surface-2)}
.demo-head .idx{font-size:11px;font-weight:700;color:var(--text-2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding-top:2px}
.demo-head h3{font-size:13.5px;margin:0}
.demo-head p{font-size:12px;color:var(--text-2);margin:2px 0 0}
.demo-body{padding:24px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:230px}
.demo-body.tl{align-items:stretch;justify-content:flex-start}
.long-list{width:100%}
.ll-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);min-width:0}
.ll-row:last-child{border-bottom:0}
.ll-body{flex:1;min-width:0}
.ll-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ll-sub{font-size:11.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ll-tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--text-2);flex-shrink:0}
.g-close{position:fixed;top:20px;right:20px;z-index:95}

/* ============ 响应式 ============ */
@media(max-width:1080px){ .lanes{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:720px){
  .reviewbar{font-size:11.5px;gap:8px}
  .reviewbar .lbl{display:none}
  .wrap{height:auto;min-height:calc(100vh - 38px)}
  .app{flex-direction:column}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--border)}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav-item{border-left:0;border-bottom:3px solid transparent}
  .nav-item[data-on="true"]{border-left-color:transparent;border-bottom-color:var(--accent)}
  .nav-item .hint{display:none}
  .submenu{max-height:200px}
  .side-foot{display:none}
  .lanes{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .views{padding:14px 14px 36px}
  .page-head{padding:14px 14px 12px}
  .drawer{width:100vw}
  .gallery{padding:14px}
}

  v.querySelectorAll('[data-open-dr]').forEach(function(b){b.onclick=function(){openDrawer('dr',b.getAttribute('data-open-dr'));};});
  v.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(e){e.stopPropagation();openModal(b.getAttribute('data-del'));};});
  v.querySelectorAll('[data-copy]').forEach(function(b){b.onclick=function(){var q=b.getAttribute('data-copy');try{navigator.clipboard.writeText(q);}catch(e){}var s=document.createElement('span');s.className='ask-copied';s.textContent='已复制';b.appendChild(s);setTimeout(function(){s.remove();},1500);};});
  document.querySelectorAll('#head-tools [data-mode]').forEach(function(b){b.onclick=function(){S.mode=b.getAttribute('data-mode');render();};});
  document.querySelectorAll('#head-tools [data-full]').forEach(function(b){b.onclick=function(){openModal('全屏灯箱（本稿示意入口；缩放/平移见实现）');};});
  document.querySelectorAll('#head-tools #theme-toggle-2').forEach(function(b){b.onclick=toggleTheme;});
}
function render(){
  renderNav();renderSubmenu();
  document.getElementById('page-title').textContent=TITLES[S.page][0];
  document.getElementById('page-sub').textContent=TITLES[S.page][1];
  document.getElementById('head-tools').innerHTML=themeToggleHTML();
  var v=document.getElementById('views');v.className='views'+(S.page==='pipeline'?' pipeline':'');
  if(S.page==='pipeline')v.innerHTML=renderPipeline();
  else if(S.page==='reports')v.innerHTML=renderReport('default');
  else v.innerHTML=renderAbout('default');
  if(S.page==='reports'){bindViews();}else{bindViews();}
  var t=document.getElementById('theme-toggle');if(t)t.onclick=toggleTheme;
}
function toggleTheme(){var r=document.documentElement;var cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');var next=cur==='dark'?'light':'dark';r.dataset.theme=next;try{localStorage.setItem('theme',next);}catch(e){}}

/* ============================ 状态陈列（八态） ============================ */
var GALLERY=[

  {n:'02',t:'加载 · 骨架屏',d:'结构与真实内容一致，避免跳版；深浅两套骨架色',r:function(){return '<div style="width:100%">'+skeleton([' w80',' w60',' w100',' w40'])+'</div>';}},
  {n:'03',t:'错误 · 请求失败',d:'原因 + 重试 + 错误码/请求 ID',tl:false,r:function(){return errorState({title:'加载失败',body:'没能读到台账。服务端起来了吗？',secondary:'查看服务状态',code:'ERR_NETWORK · 请求 ID: req_9f3a21'});}},
  {n:'04',t:'无权限',d:'明确是权限问题，不是内容不存在',r:function(){return nopermState({title:'你没有访问权限',body:'本地面板默认单人无鉴权；多用户后此处给权限说明 + 申请入口。',action:''});}},
  {n:'05',t:'离线 · 顶部提示',d:'不阻断操作，明确说明数据状态',tl:true,r:function(){return offlineBanner()+'<div class="skel">'+skeleton([' w80',' w60',' w100'])+'</div>';}},
  {n:'06',t:'超长内容 · 截断',d:'中英混排 / emoji / 无空格长串全部 ellipsis',tl:true,r:function(){return '<div class="long-list">'+
      '<div class="ll-row"><span class="avatar sm" style="background:var(--id-3)">蓉</span><div class="ll-body"><div class="ll-title">WO-20261006-03-dashboard-visual-refresh 控制台视觉改版 Phase A（超长标题验证）</div><div class="ll-sub">陈微 · 2 小时前</div></div><span class="ll-tag">在办</span></div>'+
      '<div class="ll-row"><span class="avatar sm" style="background:var(--id-7)">石</span><div class="ll-body"><div class="ll-title">aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</div><div class="ll-sub">无空格长串不会撑破容器，用 ellipsis 截断</div></div><span class="ll-tag">异常</span></div>'+
      '<!-- content-emoji: State Gallery 内容示例——演示正文内 emoji 的排版与截断处理，非图标用途 -->'+
      '<div class="ll-row"><span class="avatar sm" style="background:var(--id-5)">丹</span><div class="ll-body"><div class="ll-title">&#127881;&#128640; 上线庆祝活动策划案 v2 · 预算表与复盘归档（emoji 作内容、与中英混排一并验证截断）</div><div class="ll-sub">丹丹 · 3 小时前</div></div><span class="ll-tag">通知</span></div>'+
      '<div class="ll-row"><span class="avatar sm" style="background:var(--id-1)">H</span><div class="ll-body"><div class="ll-title">汇报 · 2026/10/5 · ai-matrix 图形版已生成，附多维指标与趋势</div><div class="ll-sub">Hugo · 昨天 20:54</div></div><span class="ll-tag">汇报</span></div>'+
    '</div>';}},
  {n:'07',t:'部分失败',d:'局部报错不应让整个页面归零',tl:true,r:function(){return '<div class="partial-bar"><i style="width:78%"></i><i class="err" style="width:22%"></i></div><div style="display:flex;gap:16px;font-size:12px;margin-bottom:14px"><div><b>14</b> <span class="sub">个区块正常</span></div><div><b style="color:var(--danger)">4</b> <span class="sub">个读取失败</span></div></div><div class="banner err"><span class="ic">'+I('alert',16)+'</span><div class="t">4 个数据源暂时不可用<small>错误：辦结工单目录读取超时</small></div><button class="btn btn-sm">只重试失败项</button></div>';}},
  {n:'08',t:'成功 · 轻提示',d:'不打扰操作流，3 秒自动消失',r:function(){return '<div class="center-state"><div class="ic ok">'+I('check',26)+'</div><h4>已复制</h4><p>提示轻巧出现，不阻断你手上的操作。</p></div>';}}
];
function renderGallery(){var g=document.getElementById('gallery');g.hidden=false;
  g.innerHTML='<button class="btn g-close" id="gallery-close">关闭</button>'+
    '<div class="gallery-head"><div><h1>状态陈列 · 八态</h1><p>页面交付时必须一并给出这些状态，而不是让开发去猜。每张卡展示一个具体场景，含文案与行动出口；编号用等宽字体，方便评审精确引用「第 7 张卡」。</p></div><div style="margin-left:auto"><span class="chip">当前色板 '+(document.documentElement.dataset.palette==='warm'?'暖夜灯（对比）':'冷静灰（主稿）')+' · 双主题随全局</span></div></div>'+
    '<div class="gallery-grid">'+GALLERY.map(function(c){return '<div class="demo"><div class="demo-head"><span class="idx">'+c.n+'</span><div><h3>'+c.t+'</h3><p>'+c.d+'</p></div></div><div class="demo-body'+(c.tl?' tl':'')+'">'+c.r()+'</div></div>';}).join('')+'</div>';
  document.getElementById('gallery-close').onclick=function(){g.hidden=true;};}

/* ============================ 启动 ============================ */
document.getElementById('palette-seg').querySelectorAll('[data-palette]').forEach(function(b){b.onclick=function(){
  var p=b.getAttribute('data-palette');document.documentElement.dataset.palette=p;try{localStorage.setItem('palette',p);}catch(e){}
  document.getElementById('palette-seg').querySelectorAll('[data-palette]').forEach(function(x){x.setAttribute('data-on',String(x===b));});
  if(!document.getElementById('gallery').hidden)renderGallery();
};});
var curP=document.documentElement.dataset.palette||'cool';
document.getElementById('palette-seg').querySelectorAll('[data-palette]').forEach(function(x){x.setAttribute('data-on',String(x.getAttribute('data-palette')===curP));});
document.getElementById('gallery-open').onclick=renderGallery;
document.getElementById('drawer-mask').onclick=closeDrawer;
document.getElementById('drawer-close').onclick=closeDrawer;
document.getElementById('del-cancel').onclick=closeModal;
document.getElementById('del-ok').onclick=closeModal;
document.getElementById('modal-mask').onclick=function(e){if(e.target.id==='modal-mask')closeModal();};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDrawer();closeModal();var g=document.getElementById('gallery');if(!g.hidden)g.hidden=true;}});
render();
</script>
