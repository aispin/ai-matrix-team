<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" role="img">
  <title>专家团、专家、技能三层关系图</title>
  <desc>专家团由多个专家组成，专家在会话中加载技能，技能是知识包；以 ai-matrix 专家团为实例。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="14" font-weight="500" fill="#26215C">三层结构：专家团 ⊃ 专家 → 加载 → 技能</text>

  <rect x="40" y="50" width="600" height="330" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="60" y="78" font-size="14" font-weight="500" fill="#3C3489">专家团 Team（一个包，多角色协作）</text>
  <text x="60" y="98" font-size="12" fill="#534AB7">plugin.json 声明 agents 列表 + settings.json 指定主理人</text>

  <rect x="64" y="112" width="272" height="118" rx="12" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="80" y="136" font-size="13" font-weight="500" fill="#26215C">主理人 agent</text>
  <text x="80" y="156" font-size="12" fill="#3C3489">PC · 产研高级总监（团长）</text>
  <text x="80" y="176" font-size="12" fill="#3C3489">接指令 · 开工单 · 派单收口</text>
  <text x="80" y="196" font-size="12" fill="#3C3489">团队入口 = settings.json 指向它</text>

  <rect x="64" y="244" width="272" height="118" rx="12" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="80" y="268" font-size="13" font-weight="500" fill="#26215C">成员 agent × 4</text>
  <text x="80" y="288" font-size="12" fill="#3C3489">毛毛（产品设计师）· Bruce（开发）</text>
  <text x="80" y="308" font-size="12" fill="#3C3489">石头（质检）· 陈波（运维）</text>
  <text x="80" y="328" font-size="12" fill="#3C3489">主理人以子代理方式派活给他们</text>

  <rect x="368" y="112" width="248" height="250" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="384" y="136" font-size="13" font-weight="500" fill="#2C2C2A">会话内协作</text>
  <text x="384" y="160" font-size="12" fill="#444441">用户 → 挂载专家团 → 找主理人</text>
  <text x="384" y="184" font-size="12" fill="#444441">主理人 spawn 成员 agent</text>
  <text x="384" y="208" font-size="12" fill="#444441">成员各自读自己的 SKILL.md</text>
  <text x="384" y="238" font-size="12" fill="#5F5E5A">团队 ≠ 多个独立会话，</text>
  <text x="384" y="258" font-size="12" fill="#5F5E5A">而是一个会话里的多角色分工</text>

  <rect x="40" y="404" width="600" height="120" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="432" font-size="14" font-weight="500" fill="#085041">技能 Skill（知识包，可被任何 agent 加载）</text>
  <rect x="60" y="448" width="160" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="140" y="470" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#085041">aimatrix-guard</text>
  <rect x="240" y="448" width="160" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="320" y="470" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#085041">aimatrix-product-designer</text>
  <rect x="420" y="448" width="200" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="520" y="470" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#085041">…共 10 个，软链激活</text>

  <path d="M200 390 L200 440" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="424" font-size="12" fill="#0F6E56">专家读技能 = 装上作业手册</text>

  <text x="40" y="548" font-size="12" fill="#444441">专家团/专家 = 「谁来做」（身份与流程）；技能 = 「怎么做」（方法与规则）。</text>
</svg>
